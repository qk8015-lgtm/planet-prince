<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Planet Prince 3D - Sky Style</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000; /* 預防加載時白屏 */
    }
    #score-ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: 'Arial', sans-serif;
      pointer-events: none;
      text-shadow: 0 0 10px #ffcc00;
    }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 5px 0; font-size: 18px; color: #ffe08a; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<div id="start-overlay"
     style="
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.2);  /* 半透明灰色遮罩 */
        backdrop-filter: blur(4px);     /* 可選：淡淡模糊效果 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        letter-spacing: 2px;
        z-index: 9999;
        user-select: none;
     ">
    <div style="max-width: 720px; padding: 28px 34px; text-align:center; border: 1px solid rgba(255,255,255,0.22); border-radius: 18px; background: rgba(0,0,0,0.25);">
  <div id="cover-title" style="font-size: 54px; font-weight: 700; letter-spacing: 4px; margin-bottom: 16px;"></div>
  <div id="cover-body" style="font-size: 22px; line-height: 1.8; letter-spacing: 1px; white-space: pre-line; opacity: 0.95;"></div>
  <div id="cover-hint" style="margin-top: 22px; font-size: 18px; opacity: 0.9;">按 Enter 開始</div>
</div>

</div>
<div id="gameover-overlay"
     style="
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.2);
        backdrop-filter: blur(4px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 32px;
        letter-spacing: 2px;
        z-index: 9999;
        user-select: none;
     ">
    <div style="text-align:center;">
        遊戲結束<br><br>
        按 Enter 重新開始<br>
        按 1 / 2 / 3 切換關卡
    </div>
</div>

<!-- ✅ 破關畫面：要放在 gameover-overlay 後面（同一層） -->
<div id="clear-overlay"
     style="
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.2);
        backdrop-filter: blur(4px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        letter-spacing: 2px;
        z-index: 9999;
        user-select: none;
     ">
  <div style="max-width: 720px; padding: 28px 34px; text-align:center; border: 1px solid rgba(255,255,255,0.22); border-radius: 18px; background: rgba(0,0,0,0.25); white-space: pre-line; line-height: 1.8;">
    <div id="clear-body"></div>
    <div style="margin-top: 22px; font-size: 18px; opacity: 0.9;">按 Enter 回到第一關</div>
  </div>
</div>

    </div>
</div>
<div id="level-overlay"
     style="
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 32px;
        letter-spacing: 2px;
        z-index: 9998;
        user-select: none;
     ">
    <div id="level-text" style="text-align:center;"></div>
    <div style="margin-top: 20px; font-size: 22px;">
        按 Enter 開始
    </div>
</div>

<div id="story-modal" 
     class="hidden"
     style="
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
        display: none; /* 由 JS 控制 */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        letter-spacing: 2px;
        z-index: 10000;
        user-select: none;
     ">
    <div style="max-width: 720px; padding: 28px 34px; text-align:center; border: 1px solid rgba(157, 124, 243, 0.3); border-radius: 18px; background: rgba(0,0,0,0.85); box-shadow: 0 0 20px rgba(157, 124, 243, 0.1);">
        
        <div id="story-text" style="color: #9d7cf3; text-shadow: 0 0 8px rgba(157, 124, 243, 0.4); font-size: 22px; line-height: 1.8; letter-spacing: 1px; white-space: pre-line; opacity: 1.0;"></div>
        
        <div id="story-hint" style="margin-top: 22px; font-size: 16px; color: #bbb; opacity: 0.8;">按 Enter 繼續</div>
    </div>
</div>
<body>

<div id="score-ui">
  <h1 id="score-text">Score: 0</h1>
  <p id="combo-text">Combo x0</p>
</div>

<script type="module">
  import "./game.js";
</script>

</body>
</html>
